# TGWAB dependency updates—DEV-STANDARDS §15.
# This repo has no package.json; github-actions is the only ecosystem.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    labels: [dependencies]
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns: ["*"]
