name: Deploy to Cloudflare Pages

# Direct-upload deploy model, matching elsanjose.com: this workflow is the single
# deploy path for this site, and Cloudflare's Git integration is turned off for
# the project (§4 — exactly one deploy path).
#
#   push to main   → production deployment
#   pull_request   → preview deployment (branch alias)
#
# Without a CLOUDFLARE_API_TOKEN secret the deploy step skips green rather than
# failing. That is deliberate: this file can land before the secret exists, and
# can never race a still-enabled Git integration.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN   Cloudflare Pages:Edit on the TechGuyWithABeard account

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the deploy credential
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN — skipping deploy (see the header)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Stage only the site into _site/. The repo root also holds CI config,
      # scripts, and Markdown, and deploying `.` published all of them at
      # capondargan.com (README.md, scripts/*.sh, .github/**).
      - name: Stage site files
        if: steps.gate.outputs.ok == 'true'
        run: >
          rsync -a
          --exclude='.git'
          --exclude='.github/'
          --exclude='.gitignore'
          --exclude='.nvmrc'
          --exclude='scripts/'
          --exclude='*.md'
          --exclude='_site/'
          ./ _site/

      # Fails in both directions: an internal path that was staged, or a file
      # the site needs that the excludes dropped.
      - name: Verify the staged site
        if: steps.gate.outputs.ok == 'true'
        run: |
          leaked=$(find _site \( -name '*.md' -o -path '_site/.github*' -o -path '_site/scripts*' -o -name '.gitignore' -o -name '.nvmrc' \) -print)
          if [ -n "$leaked" ]; then
            echo "Internal paths were staged:"
            echo "$leaked"
            exit 1
          fi
          for f in index.html 404.html _headers _redirects robots.txt .well-known/security.txt; do
            [ -f "_site/$f" ] || { echo "Missing from _site/: $f"; exit 1; }
          done

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8a0d49b1f3fdcdadec135562ec8a4fdc' }}
        run: >
          npx wrangler@4 pages deploy _site
          --project-name capondargan-com
          --branch ${{ github.ref == 'refs/heads/main' && 'main' || github.head_ref }}
          --commit-dirty=false
